services:
  postgres:
    image: postgres:16-alpine
    container_name: inveniq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inveniq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inveniq_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-inveniq_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inveniq_user} -d ${POSTGRES_DB:-inveniq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inveniq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: inveniq-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: inveniq-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://inveniq_user:inveniq_secure_pass@postgres:5432/inveniq_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - LAKEHOUSE_PATH=/app/data/lakehouse
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: inveniq-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://inveniq_user:inveniq_secure_pass@postgres:5432/inveniq_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - LAKEHOUSE_PATH=/app/data/lakehouse
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./web
      dockerfile: ../infra/docker/Dockerfile.web
    container_name: inveniq-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1

volumes:
  pgdata:
  redisdata:
  miniodata:
