global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "inveniq-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: "production"
          service: "inveniq-api"

  - job_name: "inveniq-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["worker:8001"]
        labels:
          environment: "production"
          service: "inveniq-worker"
