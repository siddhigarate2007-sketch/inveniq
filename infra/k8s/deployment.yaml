apiVersion: apps/v1
kind: Deployment
metadata:
  name: inveniq-api
  namespace: inveniq
  labels:
    app.kubernetes.io/name: inveniq-api
    app.kubernetes.io/part-of: inveniq
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inveniq-api
  template:
    metadata:
      labels:
        app: inveniq-api
    spec:
      containers:
        - name: api
          image: inveniq-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: inveniq-config
            - secretRef:
                name: inveniq-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inveniq-worker
  namespace: inveniq
  labels:
    app.kubernetes.io/name: inveniq-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inveniq-worker
  template:
    metadata:
      labels:
        app: inveniq-worker
    spec:
      containers:
        - name: worker
          image: inveniq-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: inveniq-config
            - secretRef:
                name: inveniq-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
